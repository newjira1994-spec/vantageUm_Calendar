name: Daily Calendar Sync

on:
  schedule:
    # Run at 9:00 AM UTC+7 (which is 2:00 AM UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lark CLI and run sync
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          BO_COORDINATOR_CALENDAR_ID: ${{ vars.BO_COORDINATOR_CALENDAR_ID || 'ou_c6bdc791b875c3af1775a652bcf3b638' }}
          NEW_JIRA_CALENDAR_ID: ${{ vars.NEW_JIRA_CALENDAR_ID || 'ou_dc36b8ad99537b07510b9af57d152136' }}
          SYNC_DAYS_FORWARD: ${{ vars.SYNC_DAYS_FORWARD || '7' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
        run: |
          # Install Lark CLI
          curl -fsSL https://raw.githubusercontent.com/larksuite/lark-cli/main/install.sh | sh
          export PATH="$HOME/.lark-cli/bin:$PATH"

          # Configure Lark CLI
          lark-cli config set app.id "$LARK_APP_ID"
          lark-cli config set app.secret "$LARK_APP_SECRET"

          # Run sync script
          chmod +x sync-with-lark-cli.sh
          ./sync-with-lark-cli.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-sync-logs
          path: calendar-sync.log
          retention-days: 30